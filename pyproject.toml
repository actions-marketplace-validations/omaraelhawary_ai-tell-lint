[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tell-lint"
version = "1.0.0"
description = "Lint prose for AI-sounding writing."
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
ai-tell-lint = "ai_tell_lint.cli:main"

[tool.setuptools]
packages = ["ai_tell_lint"]

[tool.setuptools.package-data]
ai_tell_lint = ["rules.json"]
